<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Houses of Faith — Virtual Temple</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    #hint {
      position: fixed;
      bottom: 12px;
      left: 0;
      right: 0;
      text-align: center;
      color: #ccc;
      font-family: Georgia, serif;
      font-size: 14px;
      opacity: 0.7;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="hint">Drag to look • Scroll / pinch to zoom</div>

  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
    import { OrbitControls } from "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js";

    // Scene
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);

    // Camera
    const camera = new THREE.PerspectiveCamera(
      60,
      window.innerWidth / window.innerHeight,
      0.1,
      200
    );
    camera.position.set(0, 10, 22);

    // Renderer
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    // Controls
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 5, 0);
    controls.maxPolarAngle = Math.PI * 0.48;

    // Lights
    scene.add(new THREE.AmbientLight(0xffffff, 0.4));

    const sun = new THREE.DirectionalLight(0xffffff, 0.9);
    sun.position.set(10, 20, 10);
    scene.add(sun);

    // Materials
    const stone = new THREE.MeshStandardMaterial({ color: 0x9a9a9a, roughness: 0.9 });
    const darkStone = new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.95 });

    // Floor
    const floor = new THREE.Mesh(
      new THREE.BoxGeometry(26, 1, 26),
      darkStone
    );
    floor.position.y = -0.5;
    scene.add(floor);

    // Walls
    const W = 26, D = 26, H = 10, T = 1;

    const backWall = new THREE.Mesh(
      new THREE.BoxGeometry(W, H, T),
      stone
    );
    backWall.position.set(0, H / 2, -D / 2);
    scene.add(backWall);

    const leftWall = new THREE.Mesh(
      new THREE.BoxGeometry(T, H, D),
      stone
    );
    leftWall.position.set(-W / 2, H / 2, 0);
    scene.add(leftWall);

    const rightWall = new THREE.Mesh(
      new THREE.BoxGeometry(T, H, D),
      stone
    );
    rightWall.position.set(W / 2, H / 2, 0);
    scene.add(rightWall);

    // Roof
    const roof = new THREE.Mesh(
      new THREE.BoxGeometry(W, 1, D),
      darkStone
    );
    roof.position.set(0, H + 0.5, 0);
    scene.add(roof);

    // Columns
    const colGeo = new THREE.CylinderGeometry(0.6, 0.6, H, 24);
    for (const z of [-7, 7]) {
      for (const x of [-8, -3, 3, 8]) {
        const col = new THREE.Mesh(colGeo, stone);
        col.position.set(x, H / 2, z);
        scene.add(col);
      }
    }

    // Resize
    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Animate
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
