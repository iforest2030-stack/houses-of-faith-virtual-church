<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Houses of Faith – Closed Temple</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      height: 100%;
    }
    #hint {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 14px;
      text-align: center;
      color: #fff;
      opacity: 0.7;
      font-family: Georgia, serif;
      font-size: 14px;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="hint">Drag to look • Scroll to zoom</div>

  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
    import { OrbitControls } from "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js";

    // Scene
    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x000000, 10, 60);

    // Camera
    const camera = new THREE.PerspectiveCamera(
      60,
      window.innerWidth / window.innerHeight,
      0.1,
      200
    );
    camera.position.set(0, 7, 18);

    // Renderer
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    // Controls
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 4, 0);

    // Lights
    scene.add(new THREE.AmbientLight(0xffffff, 0.35));

    const keyLight = new THREE.DirectionalLight(0xffffff, 0.9);
    keyLight.position.set(8, 14, 10);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0xffffff, 0.35);
    fillLight.position.set(-10, 6, -8);
    scene.add(fillLight);

    // Materials
    const stone = new THREE.MeshStandardMaterial({
      color: 0xb9b2a8,
      roughness: 0.9,
      metalness: 0
    });

    const darkStone = new THREE.MeshStandardMaterial({
      color: 0x6b6762,
      roughness: 0.95,
      metalness: 0
    });

    // Floor
    const floor = new THREE.Mesh(
      new THREE.BoxGeometry(22, 1, 22),
      darkStone
    );
    floor.position.y = -0.5;
    scene.add(floor);

    // Walls
    const backWall = new THREE.Mesh(
      new THREE.BoxGeometry(22, 10, 1),
      stone
    );
    backWall.position.set(0, 4, -11);
    scene.add(backWall);

    const leftWall = new THREE.Mesh(
      new THREE.BoxGeometry(1, 10, 22),
      stone
    );
    leftWall.position.set(-11, 4, 0);
    scene.add(leftWall);

    const rightWall = leftWall.clone();
    rightWall.position.set(11, 4, 0);
    scene.add(rightWall);

    // Roof
    const roof = new THREE.Mesh(
      new THREE.BoxGeometry(22, 1, 22),
      stone
    );
    roof.position.set(0, 9.5, 0);
    scene.add(roof);

    // Columns
    const columnGeo = new THREE.CylinderGeometry(0.6, 0.6, 8, 32);
    const columnMat = new THREE.MeshStandardMaterial({ color: 0x333333 });

    for (let x of [-6, 6]) {
      for (let z of [-6, 6]) {
        const column = new THREE.Mesh(columnGeo, columnMat);
        column.position.set(x, 4, z);
        scene.add(column);
      }
    }

    // Resize
    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Animate
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
