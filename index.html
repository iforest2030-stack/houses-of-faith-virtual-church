<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Houses of Faith — Closed Temple</title>
  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000; }
    #hint {
      position: fixed; left:0; right:0; bottom:14px;
      text-align:center; color:#fff; opacity:.75;
      font-family: Georgia, serif; font-size:14px; pointer-events:none;
    }
    #err {
      position: fixed; top:10px; left:10px; right:10px;
      color:#ffb3b3; font:12px ui-monospace, Menlo, monospace;
      white-space: pre-wrap; background: rgba(0,0,0,.55);
      padding:10px; border-radius:8px; display:none;
    }
  </style>
</head>
<body>
  <div id="hint">Drag to look • Scroll to zoom</div>
  <div id="err"></div>

  <script type="module">
    // ----- Error overlay (για iPad) -----
    const errBox = document.getElementById('err');
    window.addEventListener('error', (e) => {
      errBox.style.display = 'block';
      errBox.textContent = 'JS error:\\n' + (e.message || e.error || e);
    });
    window.addEventListener('unhandledrejection', (e) => {
      errBox.style.display = 'block';
      errBox.textContent = 'Promise error:\\n' + (e.reason || e);
    });

    // ----- THREE via ES Modules (ΣΗΜΑΝΤΙΚΟ) -----
    import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
    import { OrbitControls } from 'https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js';

    // ----- Scene -----
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);
    scene.fog = new THREE.Fog(0x000000, 12, 70);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 300);
    camera.position.set(0, 10, 26);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    // ----- Controls -----
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 7, 0);

    // ----- Lights -----
    scene.add(new THREE.AmbientLight(0xffffff, 0.35));

    const key = new THREE.DirectionalLight(0xffffff, 0.95);
    key.position.set(10, 18, 8);
    scene.add(key);

    const fill = new THREE.DirectionalLight(0xffffff, 0.35);
    fill.position.set(-12, 10, -10);
    scene.add(fill);

    // ----- Materials -----
    const stone = new THREE.MeshStandardMaterial({ color: 0xb9b2a8, roughness: 0.9, metalness: 0.0 });
    const darkStone = new THREE.MeshStandardMaterial({ color: 0x6b6762, roughness: 0.95, metalness: 0.0 });
    const wallMat = new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.95 });

    // ----- FLOOR -----
    const floor = new THREE.Mesh(
      new THREE.BoxGeometry(26, 1, 26),
      darkStone
    );
    floor.position.y = -0.5;
    scene.add(floor);

    // ----- ROOM (WALLS + ROOF)  ΚΛΕΙΣΤΟΣ ΝΑΟΣ -----
    // Διαστάσεις "δωματίου"
    const roomW = 24;  // πλάτος (x)
    const roomH = 12;  // ύψος (y)
    const roomD = 24;  // βάθος (z)
    const thick = 1;   // πάχος τοίχου

    // Πίσω τοίχος
    const backWall = new THREE.Mesh(
      new THREE.BoxGeometry(roomW, roomH, thick),
      wallMat
    );
    backWall.position.set(0, roomH/2 - 0.5, -roomD/2);
    scene.add(backWall);

    // Μπροστά τοίχος
    const frontWall = new THREE.Mesh(
      new THREE.BoxGeometry(roomW, roomH, thick),
      wallMat
    );
    frontWall.position.set(0, roomH/2 - 0.5, roomD/2);
    scene.add(frontWall);

    // Αριστερός τοίχος
    const leftWall = new THREE.Mesh(
      new THREE.BoxGeometry(thick, roomH, roomD),
      wallMat
    );
    leftWall.position.set(-roomW/2, roomH/2 - 0.5, 0);
    scene.add(leftWall);

    // Δεξιός τοίχος
    const rightWall = leftWall.clone();
    rightWall.position.set(roomW/2, roomH/2 - 0.5, 0);
    scene.add(rightWall);

    // Οροφή
    const roof = new THREE.Mesh(
      new THREE.BoxGeometry(roomW + 2, thick, roomD + 2),
      wallMat
    );
    roof.position.set(0, roomH - 0.5, 0);
    scene.add(roof);

    // ----- COLUMNS (κολόνες) -----
    const colGeo = new THREE.CylinderGeometry(0.7, 0.7, 10, 32);
    const colMat = stone;

    // 8 κολόνες (4 μπροστά + 4 πίσω)
    const colY = 5; // μέση στο ύψος
    const colX = [-8, -3, 3, 8];
    const colZ = [-8, 8];

    for (const z of colZ) {
      for (const x of colX) {
        const col = new THREE.Mesh(colGeo, colMat);
        col.position.set(x, colY, z);
        scene.add(col);
      }
    }

    // ----- Resize -----
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ----- Animate -----
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
