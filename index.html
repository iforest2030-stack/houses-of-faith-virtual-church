<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Houses of Faith — Closed Temple</title>
  <style>
    html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000; }
    #hint{
      position:fixed; left:0; right:0; bottom:14px;
      text-align:center; color:#fff; opacity:.75;
      font-family: Georgia, serif; font-size:14px; pointer-events:none;
      z-index:10;
    }
    #err{
      position:fixed; top:10px; left:10px; right:10px;
      color:#ffb3b3; font:12px ui-monospace, Menlo, monospace;
      white-space:pre-wrap; background:rgba(0,0,0,.45);
      padding:10px; border-radius:8px; display:none;
      z-index:20;
    }
  </style>
</head>

<body>
  <div id="hint">Drag to look • Scroll / pinch to zoom</div>
  <div id="err"></div>

  <script type="module">
    // ---- Error box (useful on iPad) ----
    const errBox = document.getElementById('err');
    window.addEventListener('error', (e) => {
      errBox.style.display = 'block';
      errBox.textContent = 'JS error:\\n' + (e.message || e.error || e);
    });
    window.addEventListener('unhandledrejection', (e) => {
      errBox.style.display = 'block';
      errBox.textContent = 'Promise error:\\n' + (e.reason?.message || e.reason || e);
    });

    // ---- Three.js as module (fixes OrbitControls undefined) ----
    import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
    import { OrbitControls } from 'https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js';

    // ---- Scene / Camera / Renderer ----
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);
    scene.fog = new THREE.Fog(0x000000, 12, 80);

    const camera = new THREE.PerspectiveCamera(
      60,
      window.innerWidth / window.innerHeight,
      0.1,
      300
    );
    camera.position.set(0, 9, 22);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    // ---- Controls ----
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.target.set(0, 5, 0);
    controls.minDistance = 10;
    controls.maxDistance = 70;
    controls.maxPolarAngle = Math.PI * 0.49; // να μην πάει κάτω από το πάτωμα

    // ---- Lights ----
    scene.add(new THREE.AmbientLight(0xffffff, 0.35));

    const key = new THREE.DirectionalLight(0xffffff, 0.95);
    key.position.set(8, 18, 10);
    scene.add(key);

    const fill = new THREE.DirectionalLight(0xffffff, 0.35);
    fill.position.set(-10, 10, -8);
    scene.add(fill);

    const rim = new THREE.PointLight(0xffffff, 0.35, 200);
    rim.position.set(0, 16, -20);
    scene.add(rim);

    // ---- Materials ----
    const stone = new THREE.MeshStandardMaterial({ color: 0xb9b9b9, roughness: 0.9, metalness: 0.0 });
    const darkStone = new THREE.MeshStandardMaterial({ color: 0x6f6f6f, roughness: 0.95, metalness: 0.0 });
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 1.0, metalness: 0.0 });

    // ---- FLOOR ----
    const floor = new THREE.Mesh(
      new THREE.BoxGeometry(26, 1, 26),
      floorMat
    );
    floor.position.y = -0.5;
    scene.add(floor);

    // ---- ROOM (WALLS + ROOF) ----
    // Διαστάσεις “ναού”
    const W = 26;      // πλάτος (x)
    const D = 26;      // βάθος (z)
    const H = 12;      // ύψος τοίχων (y)
    const T = 1.2;     // πάχος τοίχων

    // Back wall
    const backWall = new THREE.Mesh(
      new THREE.BoxGeometry(W, H, T),
      stone
    );
    backWall.position.set(0, H/2, -D/2);
    scene.add(backWall);

    // Left wall
    const leftWall = new THREE.Mesh(
      new THREE.BoxGeometry(T, H, D),
      stone
    );
    leftWall.position.set(-W/2, H/2, 0);
    scene.add(leftWall);

    // Right wall
    const rightWall = leftWall.clone();
    rightWall.position.set(W/2, H/2, 0);
    scene.add(rightWall);

    // Front wall (κλειστός — χωρίς άνοιγμα)
    const frontWall = new THREE.Mesh(
      new THREE.BoxGeometry(W, H, T),
      stone
    );
    frontWall.position.set(0, H/2, D/2);
    scene.add(frontWall);

    // Roof (οροφή)
    const roof = new THREE.Mesh(
      new THREE.BoxGeometry(W, 1, D),
      darkStone
    );
    roof.position.set(0, H + 0.5, 0);
    scene.add(roof);

    // ---- COLUMNS (κολόνες) ----
    // 8 κολόνες (2 σειρές x 4) μέσα στον ναό
    const colGeo = new THREE.CylinderGeometry(0.75, 0.85, 10, 28);
    const colMat = new THREE.MeshStandardMaterial({ color: 0x8a8a8a, roughness: 0.9 });

    const colY = 5; // επειδή ύψος κολόνας 10
    const xPositions = [-8.5, -3, 3, 8.5];
    const zPositions = [-7, 7];

    for (const z of zPositions) {
      for (const x of xPositions) {
        const col = new THREE.Mesh(colGeo, colMat);
        col.position.set(x, colY, z);
        scene.add(col);
      }
    }

    // ---- Small steps (προαιρετικά σκαλοπάτι/βάση) ----
    const step1 = new THREE.Mesh(new THREE.BoxGeometry(28, 0.6, 28), new THREE.MeshStandardMaterial({ color: 0x1f1f1f, roughness: 1 }));
    step1.position.y = -1.1;
    scene.add(step1);

    // ---- Resize ----
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ---- Animate ----
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
