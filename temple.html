<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Houses of Faith — Closed Temple</title>
  <style>
    html, body { margin:0; padding:0; overflow:hidden; background:#000; height:100%; }
    #hint{
      position:fixed; left:0; right:0; bottom:14px;
      text-align:center; color:#fff; opacity:.75;
      font-family: Georgia, serif; font-size:14px;
      pointer-events:none;
    }
    #err{
      position:fixed; top:10px; left:10px; right:10px;
      color:#ffb3b3; font-family: ui-monospace, Menlo, monospace;
      font-size:12px; white-space:pre-wrap; opacity:.95;
      display:none;
    }
  </style>
</head>
<body>
  <div id="hint">Drag to look • Scroll to zoom</div>
  <div id="err"></div>

  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.160.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    // Show JS errors on screen (useful on iPad)
    window.addEventListener('error', (e) => {
      const box = document.getElementById('err');
      box.style.display = 'block';
      box.textContent = "JS error:\n" + (e.message || e.error || e);
    });

    // ===== BASIC SETUP =====
    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x000000, 12, 60);

    const camera = new THREE.PerspectiveCamera(
      60, window.innerWidth / window.innerHeight, 0.1, 200
    );
    camera.position.set(0, 6, 18);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 4, 0);

    // ===== LIGHTS =====
    scene.add(new THREE.AmbientLight(0xffffff, 0.35));

    const key = new THREE.DirectionalLight(0xffffff, 0.9);
    key.position.set(8, 14, 10);
    scene.add(key);

    const fill = new THREE.DirectionalLight(0xffffff, 0.35);
    fill.position.set(-10, 6, -8);
    scene.add(fill);

    // ===== MATERIALS =====
    const stone = new THREE.MeshStandardMaterial({ color: 0xb9b2a8, roughness: 0.9, metalness: 0.0 });
    const darkStone = new THREE.MeshStandardMaterial({ color: 0x6b6762, roughness: 0.95, metalness: 0.0 });

    // ===== FLOOR =====
    const floor = new THREE.Mesh(
      new THREE.BoxGeometry(22, 1, 22),
      darkStone
    );
    floor.position.y = -0.5;
    scene.add(floor);

    // ===== ROOM (WALLS + ROOF) =====
    // back wall
    const backWall = new THREE.Mesh(
      new THREE.BoxGeometry(22, 10, 1),
      stone
    );
    backWall.position.set(0, 4, -11);
    scene.add(backWall);

    // front wall (with door opening: we just keep it low to feel like entrance)
    const frontWall = new THREE.Mesh(
      new THREE.BoxGeometry(22,
