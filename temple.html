<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Houses of Faith — Closed Temple</title>
  <style>
    html, body { margin:0; height:100%; overflow:hidden; background:#000; }
    #hint{
      position:fixed; left:0; right:0; bottom:14px;
      text-align:center; color:#fff; opacity:.75;
      font-family: Georgia, serif; font-size:14px;
      pointer-events:none;
    }
    #err{
      position:fixed; top:10px; left:10px; right:10px;
      color:#ffb3b3; font:12px ui-monospace, Menlo, monospace;
      white-space:pre-wrap; background:rgba(0,0,0,.55);
      padding:10px; border-radius:8px; display:none;
      z-index:10;
    }
  </style>
</head>
<body>
  <div id="hint">Drag to look • Scroll to zoom</div>
  <div id="err"></div>

  <script type="module">
    // ---- Show errors on screen (helpful on iPad)
    const errBox = document.getElementById('err');
    function showErr(msg){
      errBox.style.display = 'block';
      errBox.textContent = String(msg);
    }
    window.addEventListener('error', (e) => showErr('JS error:\n' + (e.message || e.error || e)));
    window.addEventListener('unhandledrejection', (e) => showErr('Promise error:\n' + (e.reason || e)));

    import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
    import { OrbitControls } from 'https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js';

    try{
      // ---- Scene
      const scene = new THREE.Scene();
      scene.fog = new THREE.Fog(0x000000, 12, 60);

      // ---- Camera
      const camera = new THREE.PerspectiveCamera(
        60, window.innerWidth / window.innerHeight, 0.1, 200
      );
      camera.position.set(0, 7, 18);

      // ---- Renderer
      const renderer = new THREE.WebGLRenderer({ antialias:true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      document.body.appendChild(renderer.domElement);

      // ---- Controls
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.target.set(0, 4, 0);
      controls.maxPolarAngle = Math.PI * 0.49;  // keep camera above floor
      controls.minDistance = 6;
      controls.maxDistance = 45;

      // ---- Lights
      scene.add(new THREE.AmbientLight(0xffffff, 0.35));

      const key = new THREE.DirectionalLight(0xffffff, 0.9);
      key.position.set(8, 14, 10);
      scene.add(key);

      const fill = new THREE.DirectionalLight(0xffffff, 0.35);
      fill.position.set(-10, 6, -8);
      scene.add(fill);

      const topGlow = new THREE.PointLight(0xffffff, 0.7, 80);
      topGlow.position.set(0, 10, 0);
      scene.add(topGlow);

      // ---- Materials
      const stone = new THREE.MeshStandardMaterial({
        color: 0xb9b2a8, roughness: 0.9, metalness: 0.0
      });
      const darkStone = new THREE.MeshStandardMaterial({
        color: 0x6b6762, roughness: 0.95, metalness: 0.0
      });
      const roofMat = new THREE.MeshStandardMaterial({
        color: 0x2b2b2b, roughness: 0.8, metalness: 0.0
      });

      // ---- Floor
      const floor = new THREE.Mesh(
        new THREE.BoxGeometry(22, 1, 22),
        darkStone
      );
      floor.position.y = -0.5;
      scene.add(floor);

      // ---- Room (Walls + Roof)  (κλειστός ναός)
      // back wall
      const backWall = new THREE.Mesh(
        new THREE.BoxGeometry(22, 10, 1),
        stone
      );
      backWall.position.set(0, 4, -11);
      scene.add(backWall);

      // left wall
      const leftWall = new THREE.Mesh(
        new THREE.BoxGeometry(1, 10, 22),
        stone
      );
      leftWall.position.set(-11, 4, 0);
      scene.add(leftWall);

      // right wall
      const rightWall = leftWall.clone();
      rightWall.position.set(11, 4, 0);
      scene.add(rightWall);

      // front wall (με μικρό "άνοιγμα" αίσθηση εισόδου)
      // Θα το κάνουμε χαμηλότερο για να μην κλείνει τελείως.
      const frontWall = new THREE.Mesh(
        new THREE.BoxGeometry(22, 6.5, 1),
        stone
      );
      frontWall.position.set(0, 3.25, 11);
      scene.add(frontWall);

      // roof
      const roof = new THREE.Mesh(
        new THREE.BoxGeometry(22, 1, 22),
        roofMat
      );
      roof.position.set(0, 9.5, 0);
      scene.add(roof);

      // ---- Columns (κολόνες)
      const colGeo = new THREE.CylinderGeometry(0.65, 0.75, 8, 28);
      const colMat = new THREE.MeshStandardMaterial({
