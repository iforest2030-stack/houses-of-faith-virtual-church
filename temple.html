<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Houses of Faith – Closed Temple</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      height: 100%;
    }
    #hint {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 14px;
      text-align: center;
      color: #fff;
      opacity: 0.75;
      font-family: Georgia, serif;
      font-size: 14px;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="hint">Drag to look • Scroll to zoom</div>

  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.160.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    // Scene
    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x000000, 10, 50);

    // Camera
    const camera = new THREE.PerspectiveCamera(
      60,
      window.innerWidth / window.innerHeight,
      0.1,
      200
    );
    camera.position.set(0, 8, 18);

    // Renderer
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // Controls
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 4, 0);

    // Lights
    scene.add(new THREE.AmbientLight(0xffffff, 0.4));
    const light = new THREE.DirectionalLight(0xffffff, 0.9);
    light.position.set(10, 15, 10);
    scene.add(light);

    // Materials
    const stone = new THREE.MeshStandardMaterial({ color: 0xb9b2a8 });
    const dark = new THREE.MeshStandardMaterial({ color: 0x333333 });

    // Floor
    const floor = new THREE.Mesh(
      new THREE.BoxGeometry(22, 1, 22),
      dark
    );
    floor.position.y = -0.5;
    scene.add(floor);

    // Walls
    const backWall = new THREE.Mesh(
      new THREE.BoxGeometry(22, 10, 1),
      stone
    );
    backWall.position.set(0, 4, -11);
    scene.add(backWall);

    const leftWall = new THREE.Mesh(
      new THREE.BoxGeometry(1, 10, 22),
      stone
    );
    leftWall.position.set(-11, 4, 0);
    scene.add(leftWall);

    const rightWall = leftWall.clone();
    rightWall.position.set(11, 4, 0);
    scene.add(rightWall);

    // Roof
    const roof = new THREE.Mesh(
      new THREE.BoxGeometry(22, 1, 22),
      stone
    );
    roof.position.set(0, 9, 0);
    scene.add(roof);

    // Columns
    const colGeo = new THREE.CylinderGeometry(0.6, 0.6, 8, 32);
    for (let x of [-6, 6]) {
      for (let z of [-6, 6]) {
        const col = new THREE.Mesh(colGeo, dark);
        col.position.set(x, 4, z);
        scene.add(col);
      }
    }

    // Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Animate
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
